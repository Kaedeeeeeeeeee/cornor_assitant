name: Deploy Peek landing page

on:
  push:
    branches:
      - main
    paths:
      - "CornerAssistantApp/landing-page/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure landing analytics
        env:
          PEEK_GA_MEASUREMENT_ID: ${{ vars.PEEK_GA_MEASUREMENT_ID }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const id = (process.env.PEEK_GA_MEASUREMENT_ID || "").trim();
          const value = /^G-[A-Z0-9]+$/.test(id) ? id : "";
          const body = `window.PEEK_GA_MEASUREMENT_ID = ${JSON.stringify(value)};\n`;
          fs.writeFileSync("CornerAssistantApp/landing-page/analytics-config.js", body);
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: CornerAssistantApp/landing-page
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
